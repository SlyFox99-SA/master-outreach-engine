name: Deploy All

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm install

      - name: Build all clients
        shell: pwsh
        run: |
          foreach ($c in @('zaheera-fragrances','techhub-phones','monetech-sneakers','lumo-skincare')) {
            & ./scripts/Build-Client.ps1 -Client $c
          }

      - name: Deploy zaheera
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-zaheera-fragrances --project-name=fragrance-seller-mockup --branch=main

      - name: Deploy techhub
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-techhub-phones --project-name=techseller-mockup --branch=main

      - name: Deploy monetech
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-monetech-sneakers --project-name=monetech-outreach --branch=main

      - name: Deploy lumo
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-lumo-skincare --project-name=lumo-mockup --branch=main

      - name: Deploy pitch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./pitch --project-name=sfox-pitch --branch=main
