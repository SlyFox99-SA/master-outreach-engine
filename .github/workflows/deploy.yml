name: Deploy All Brands

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm install
      - name: Detect changed brands
        id: detect
        shell: pwsh
        run: |
          $buildAll = $false
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $buildAll = $true }
          else {
            $changed = git diff --name-only HEAD~1 HEAD
            $infra = @('main.js','index.html','style.css','configs.js','tailwind.config.js','postcss.config.js','package.json','package-lock.json','vite.config.js','checkout.html')
            $infraHit = $changed | Where-Object { $infra -contains $_ -or $_ -like 'admin/*' -or $_ -like 'scripts/*' }
            if ($infraHit) { $buildAll = $true }
          }
          if ($buildAll) { echo "list=zaheera,monetech,lumo,techhub" >> $env:GITHUB_OUTPUT; Write-Host "BUILD ALL" -ForegroundColor Yellow; exit 0 }
          $brands = @()
          git diff --name-only HEAD~1 HEAD | ForEach-Object { if ($_ -match '^data/config-([a-z]+)\.json$') { $brands += $Matches[1] } }
          $brands = $brands | Select-Object -Unique
          if ($brands.Count -eq 0) { echo "list=" >> $env:GITHUB_OUTPUT; Write-Host "NOTHING TO BUILD" -ForegroundColor Gray }
          else { echo "list=$($brands -join ',')" >> $env:GITHUB_OUTPUT; Write-Host "BUILD: $($brands -join ',')" -ForegroundColor Cyan }
      - name: Build changed brands
        if: steps.detect.outputs.list != ''
        shell: pwsh
        run: |
          $brands = '${{ steps.detect.outputs.list }}'.Split(',')
          foreach ($b in $brands) { Write-Host "Building $b..." -ForegroundColor Cyan; & ./scripts/Build-Brand.ps1 -Brand $b }
      - name: Deploy zaheera to Cloudflare Pages
        if: contains(steps.detect.outputs.list, 'zaheera')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-zaheera --project-name=fragrance-seller-mockup --branch=main
      - name: Deploy monetech to Cloudflare Pages
        if: contains(steps.detect.outputs.list, 'monetech')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-monetech --project-name=monetech-outreach --branch=main
      - name: Deploy lumo to Cloudflare Pages
        if: contains(steps.detect.outputs.list, 'lumo')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-lumo --project-name=lumo-mockup --branch=main
      - name: Deploy techhub to Cloudflare Pages
        if: contains(steps.detect.outputs.list, 'techhub')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-techhub --project-name=techseller-mockup --branch=main