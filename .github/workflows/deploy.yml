name: Deploy All

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm install

      - name: Ensure Cloudflare Pages projects exist
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $projects = @(
            'fragrance-seller-mockup',
            'monetech-outreach',
            'lumo-mockup',
            'techseller-mockup',
            'salon-demo',
            'services-demo',
            'restaurant-demo',
            'studio-demo',
            'personal-demo',
            'starter-demo',
            'master-outreach'
          )
          foreach ($name in $projects) {
            $out = npx --yes wrangler pages project create $name --production-branch=main 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0) {
              Write-Host "created: $name"
            } elseif ($out -match 'already exists' -or $out -match 'A project with this name') {
              Write-Host "exists: $name"
            } else {
              Write-Host "unknown: $name"
            }
          }

      - name: Build all
        shell: pwsh
        run: |
          foreach ($b in @('zaheera','monetech','lumo','techhub')) {
            & ./scripts/Build-Brand.ps1 -Brand $b
          }
          foreach ($v in @('salon','services','restaurant','studio','personal','starter','pitch')) {
            & ./scripts/Build-Vertical.ps1 -Vertical $v
          }

      - name: Deploy zaheera
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-zaheera --project-name=fragrance-seller-mockup --branch=main

      - name: Deploy monetech
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-monetech --project-name=monetech-outreach --branch=main

      - name: Deploy lumo
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-lumo --project-name=lumo-mockup --branch=main

      - name: Deploy techhub
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-techhub --project-name=techseller-mockup --branch=main

      - name: Deploy salon
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-salon --project-name=salon-demo --branch=main

      - name: Deploy services
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-services --project-name=services-demo --branch=main

      - name: Deploy restaurant
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-restaurant --project-name=restaurant-demo --branch=main

      - name: Deploy studio
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-studio --project-name=studio-demo --branch=main

      - name: Deploy personal
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-personal --project-name=personal-demo --branch=main

      - name: Deploy starter
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-starter --project-name=starter-demo --branch=main

      - name: Deploy pitch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-pitch --project-name=master-outreach --branch=main