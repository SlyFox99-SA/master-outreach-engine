local_backend: true
backend:
  name: git-gateway
  branch: main
media_folder: "images"
public_folder: "/images"
media_library:
  name: cloudinary
  config:
    cloud_name: e4kmlh67
    unsigned_upload: true
    upload_preset: outreach_unsigned

collections:
  - name: "brands"
    label: "Stores"
    files:
      - name: "zaheera"
        label: "Zaheera (Fragrances)"
        file: "data/config-zaheera.json"
        fields:
          - { label: "Internal ID", name: "id", widget: "string", hint: "Do not change" }
          - { label: "Layout", name: "layout", widget: "select", options: ["gallery", "grid", "list", "showcase"] }
          - label: "Brand"
            name: "brand"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - label: "Hero"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "text" }
          - label: "Theme (RGB, space-separated)"
            name: "theme"
            widget: "object"
            fields:
              - { label: "Primary", name: "primary", widget: "string" }
              - { label: "Accent", name: "accent", widget: "string" }
              - { label: "Ink", name: "ink", widget: "string" }
              - { label: "Surface", name: "surface", widget: "string" }
          - { label: "WhatsApp Number", name: "whatsapp", widget: "string", hint: "Format: +27821234567" }
          - label: "Bank Details"
            name: "bank"
            widget: "object"
            fields:
              - { label: "Account Name", name: "accountName", widget: "string" }
              - { label: "Bank Name", name: "bankName", widget: "string" }
              - { label: "Account Number", name: "accountNumber", widget: "string" }
              - { label: "Branch Code", name: "branchCode", widget: "string" }
              - { label: "Account Type", name: "accountType", widget: "string", required: false }
          - label: "Payment Gateway (optional)"
            name: "payment"
            widget: "object"
            required: false
            fields:
              - { label: "Provider", name: "provider", widget: "select", options: ["payfast", "yoco", "ozow"], required: false }
              - { label: "Merchant ID / Checkout ID / Site Code", name: "merchantId", widget: "string", required: false }
              - { label: "Merchant Key", name: "merchantKey", widget: "string", required: false }
              - { label: "Checkout ID (Yoco)", name: "checkoutId", widget: "string", required: false }
              - { label: "Site Code (Ozow)", name: "siteCode", widget: "string", required: false }
              - { label: "Sandbox Mode", name: "sandbox", widget: "boolean", default: true, required: false }
              - { label: "Return URL", name: "returnUrl", widget: "string", required: false }
              - { label: "Cancel URL", name: "cancelUrl", widget: "string", required: false }
          - label: "Sale (optional)"
            name: "sale"
            widget: "object"
            required: false
            fields:
              - { label: "Label", name: "label", widget: "string", required: false }
              - { label: "Ends At", name: "endsAt", widget: "datetime", required: false }
              - { label: "Discount %", name: "discountPct", widget: "number", valueType: "int", required: false }
          - label: "Categories"
            name: "categories"
            widget: "list"
            field: { label: "Category", name: "category", widget: "string" }
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} - R{{fields.price}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Mock Type (phone/bottle/tube/jar/box)", name: "mockType", widget: "string", required: false }
              - { label: "Description", name: "blurb", widget: "string" }
              - { label: "Price (R)", name: "price", widget: "number", valueType: "int" }
              - { label: "Image URL", name: "image", widget: "string" }
              - { label: "Stock (use only if no variants)", name: "stock", widget: "number", valueType: "int", required: false }
              - label: "Specs"
                name: "specs"
                widget: "list"
                required: false
                field: { label: "Spec", name: "spec", widget: "string" }
              - label: "Variants"
                name: "variants"
                widget: "list"
                required: false
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Stock", name: "stock", widget: "number", valueType: "int" }
                  - { label: "Price Adjustment (R)", name: "priceDelta", widget: "number", valueType: "int", required: false }
                  - { label: "Color (hex)", name: "color", widget: "string", required: false }
