<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upload Photo</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6">
<h1 class="text-2xl font-bold text-gray-900">Upload Product Photo</h1>
<p class="mt-1 text-sm text-gray-500">Pick a photo from your gallery. It auto-compresses.</p>
<input type="file" id="file" accept="image/*" class="hidden" />
<button id="pickBtn" class="mt-6 w-full py-4 rounded-2xl bg-emerald-600 text-white font-semibold text-lg">Choose Photo</button>
<div id="status" class="mt-4 hidden text-center text-sm text-gray-600"></div>
<div id="result" class="mt-4 hidden">
<img id="preview" class="w-full rounded-2xl" />
<div id="urlBox" class="mt-4 bg-gray-100 rounded-xl p-3 text-xs font-mono break-all text-gray-700"></div>
<button id="copyBtn" class="mt-3 w-full py-3 rounded-2xl bg-blue-600 text-white font-semibold">Copy URL</button>
<p class="mt-2 text-xs text-center text-gray-500">Paste into the Image URL field in admin</p>
<button id="againBtn" class="mt-3 w-full py-2 text-sm text-gray-500">Upload another</button>
</div>
</div>
<script>
var CLOUD_NAME = "e4kmlh67";
var UPLOAD_PRESET = "outreach_unsigned";
var fileInput = document.getElementById("file");
var pickBtn = document.getElementById("pickBtn");
var statusEl = document.getElementById("status");
var resultEl = document.getElementById("result");
var previewEl = document.getElementById("preview");
var urlBox = document.getElementById("urlBox");
var copyBtn = document.getElementById("copyBtn");
var againBtn = document.getElementById("againBtn");
pickBtn.onclick = function() { fileInput.click(); };
againBtn.onclick = function() { fileInput.value = ""; resultEl.style.display = "none"; statusEl.style.display = "none"; };
fileInput.onchange = function() {
  var file = fileInput.files[0];
  if (!file) return;
  previewEl.src = URL.createObjectURL(file);
  resultEl.style.display = "block";
  statusEl.style.display = "block";
  statusEl.textContent = "Uploading...";
  var form = new FormData();
  form.append("file", file);
  form.append("upload_preset", UPLOAD_PRESET);
  form.append("folder", "products");
  fetch("https://api.cloudinary.com/v1_1/" + CLOUD_NAME + "/image/upload", { method: "POST", body: form })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.secure_url) {
        urlBox.textContent = data.secure_url + "?q_auto,f_auto,w_1000";
        statusEl.textContent = "Done - " + Math.round(data.bytes / 1024) + " KB";
        copyBtn.dataset.url = data.secure_url + "?q_auto,f_auto,w_1000";
      } else {
        statusEl.textContent = "Failed: " + (data.error && data.error.message ? data.error.message : "unknown");
      }
    })
    .catch(function(e) { statusEl.textContent = "Error: " + e.message; });
};
copyBtn.onclick = function() {
  var url = copyBtn.dataset.url;
  if (!url) return;
  navigator.clipboard.writeText(url).then(function() {
    copyBtn.textContent = "Copied!";
    setTimeout(function() { copyBtn.textContent = "Copy URL"; }, 1500);
  });
};
</script>
</body>
</html>
