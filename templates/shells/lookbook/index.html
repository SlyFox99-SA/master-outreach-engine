<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lookbook Shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/configs.js"></script>
<style>
:root{--f-display:'Fraunces',Georgia,serif;--f-body:'DM Sans',system-ui,sans-serif}
body{font-family:var(--f-body)}
.disp{font-family:var(--f-display);font-weight:600;letter-spacing:-0.02em;line-height:1}
.hero-title{font-family:var(--f-display);font-weight:400;font-style:italic}
.p-card .p-img{transition:opacity .5s ease}
.p-card .p-img-b{position:absolute;inset:0;opacity:0;transition:opacity .5s ease}
.p-card:hover .p-img-a{opacity:0}
.p-card:hover .p-img-b{opacity:1}
.size-chip{font-size:11px;min-width:28px;height:28px;border:1px solid rgba(0,0,0,0.15);display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.bag-badge{position:absolute;top:-6px;right:-8px;min-width:16px;height:16px;padding:0 4px;background:#000;color:#fff;font-size:9px;font-weight:600;border-radius:999px;display:grid;place-items:center}
</style>
</head>
<body class="bg-white text-black antialiased" x-data x-cloak>
<div class="bg-black text-white text-[11px] uppercase tracking-[0.3em] text-center py-2.5">Free shipping over R1200 &middot; Returns within 14 days</div>
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-black/10">
  <div class="max-w-7xl mx-auto px-5 h-16 flex items-center gap-8">
    <a href="/" class="disp text-xl" x-text="$store.config.brand?.name"></a>
    <nav class="hidden md:flex gap-8 text-xs uppercase tracking-[0.15em] flex-1 justify-center">
      <a href="#shop" class="hover:opacity-60">Shop</a>
      <a href="#lookbook" class="hover:opacity-60">Lookbook</a>
      <a href="#about" class="hover:opacity-60">About</a>
    </nav>
    <button class="relative flex items-center gap-2" @click="$store.cart.open = true">
      <svg viewBox="0 0 24 24" class="h-5 w-5 fill-none stroke-current" stroke-width="1.5"><path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="bag-badge" x-show="(($store.cart && $store.cart.count ? $store.cart.count() : 0)) > 0" x-text="$store.cart && $store.cart.count ? $store.cart.count() : 0"></span>
    </button>
  </div>
</header>

<section class="relative h-[85vh] min-h-[560px] overflow-hidden">
  <img :src="$store.config.heroImage || ($store.config.brand && $store.config.brand.heroImage) || 'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1600&q=80'" class="absolute inset-0 w-full h-full object-cover" alt="">
  <div class="absolute inset-0 bg-black/25"></div>
  <div class="relative h-full max-w-7xl mx-auto px-6 flex flex-col justify-end pb-20 text-white">
    <p class="text-[11px] uppercase tracking-[0.4em] opacity-90 mb-5">Autumn / Winter 2025</p>
    <h1 class="hero-title text-5xl md:text-8xl max-w-3xl leading-[0.9]" x-text="$store.config.brand?.tagline || 'Quiet luxury, everyday'"></h1>
    <div class="mt-10 flex gap-6">
      <a href="#shop" class="text-xs uppercase tracking-[0.2em] border-b border-white pb-1.5">Shop collection</a>
      <a href="#lookbook" class="text-xs uppercase tracking-[0.2em] border-b border-white/40 pb-1.5">View lookbook</a>
    </div>
  </div>
</section>

<section id="shop" class="max-w-7xl mx-auto px-5 py-14">
  <ul class="grid grid-cols-2 md:grid-cols-4 gap-x-3 gap-y-10 md:gap-x-5">
    <template x-for="p in $store.config.visibleProducts()" :key="p.id">
      <li class="p-card">
        <div class="relative aspect-[3/4] bg-neutral-100 overflow-hidden cursor-pointer" @click="$store.config.openDetail(p)">
          <img class="p-img p-img-a absolute inset-0 w-full h-full object-cover" :src="p.image || (p.images && p.images[0])" :alt="p.name" @error="if(!$event.target.dataset.f){$event.target.dataset.f='1';$event.target.src='https://placehold.co/600x800/f5f5f5/000?text='+encodeURIComponent(p.name)}">
          <img class="p-img p-img-b absolute inset-0 w-full h-full object-cover" :src="(p.images && p.images[1]) || p.image || (p.images && p.images[0])" alt="">
        </div>
        <div class="mt-4 space-y-1.5">
          <div class="flex justify-between gap-2">
            <h3 class="text-sm leading-tight" x-text="p.name"></h3>
            <p class="text-sm whitespace-nowrap" x-text="$store.config.formatZAR(p.price)"></p>
          </div>
          <p class="text-xs opacity-50" x-text="p.blurb"></p>
        </div>
      </li>
    </template>
  </ul>
</section>

<footer class="max-w-7xl mx-auto px-5 py-14 text-xs opacity-70 flex flex-wrap justify-between gap-4 uppercase tracking-[0.15em]">
  <span x-text="'© ' + new Date().getFullYear() + ' ' + ($store.config.brand?.name || '')"></span>
</footer>

<script src="/main.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</body>
</html>
