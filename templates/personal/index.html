<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{soft:'#f6f3ee',warm:'#faf7f3',soil:'#3d3028',sage:'#8fa68e',terracotta:'#c6704a'},fontFamily:{display:['"Instrument Serif"','serif'],sans:['"DM Sans"','system-ui','sans-serif']}}}}</script>
<style>body{-webkit-tap-highlight-color:transparent;font-family:'DM Sans',system-ui,sans-serif}[x-cloak]{display:none!important}.inst{font-family:'Instrument Serif',serif}</style>
</head>
<body class="bg-warm text-soil" x-data="personalApp()" x-init="init()" x-cloak>
<div class="bg-amber-400 text-ink border-b border-amber-500/30 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-2 flex items-center justify-between gap-3 text-xs md:text-sm">
    <p class="font-medium truncate">
      <span class="hidden sm:inline">👀</span>
      Demo site —
      <a href="/pitch/" class="underline underline-offset-2 hover:no-underline font-semibold">get your own from R5,000 →</a>
    </p>
    <button onclick="this.closest('div').parentElement.style.display='none'" class="text-ink/60 hover:text-ink text-lg leading-none px-1">×</button>
  </div>
</div>


<div x-show="loading" class="fixed inset-0 flex items-center justify-center bg-warm z-50">
  <div class="w-10 h-10 border-2 border-soil/20 border-t-terracotta rounded-full animate-spin"></div>
</div>

<div x-show="!loading">
<nav class="sticky top-0 z-40 bg-warm/95 backdrop-blur border-b border-soil/10">
  <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
    <h1 class="inst text-xl italic" x-text="cfg.brand?.name"></h1>
    <div class="hidden md:flex items-center gap-7 text-sm">
      <a href="#about" class="hover:text-terracotta transition">About</a>
      <a href="#work" class="hover:text-terracotta transition">Work with me</a>
      <a href="#contact" class="hover:text-terracotta transition">Contact</a>
      <a :href="waLink('Hi! I have a question.')" target="_blank" class="px-5 py-2.5 rounded-full bg-soil text-warm text-sm hover:bg-terracotta transition">Say hello</a>
    </div>
  </div>
</nav>

<section class="pt-10 md:pt-28 pb-10">
  <div class="max-w-5xl mx-auto px-6">
    <p class="text-xs uppercase tracking-[0.4em] text-terracotta mb-6" x-text="cfg.brand?.tagline"></p>
    <h2 class="inst text-4xl sm:text-5xl md:text-8xl leading-[1.0] tracking-tight" x-text="cfg.hero?.title"></h2>
    <p class="mt-8 text-lg md:text-2xl text-soil/70 leading-relaxed max-w-2xl" x-text="cfg.hero?.subtitle"></p>
    <div class="mt-10 flex flex-wrap gap-3">
      <a href="#contact" class="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-terracotta text-warm hover:bg-soil transition">Work with me</a>
      <a href="#about" class="inline-flex items-center gap-2 px-6 py-3 rounded-full border border-soil/20 hover:bg-soil/5 transition">About me</a>
    </div>
  </div>
</section>

<section class="py-12 md:py-20" id="about">
  <div class="max-w-5xl mx-auto px-6 grid md:grid-cols-2 gap-10 md:gap-16 items-center">
    <div class="aspect-[4/5] rounded-3xl overflow-hidden max-w-md mx-auto">
      <img :src="cfg.about?.image" class="w-full h-full object-cover" alt="">
    </div>
    <div>
      <h3 class="inst text-3xl md:text-5xl italic mb-6" x-text="cfg.about?.title"></h3>
      <div class="space-y-4 text-lg text-soil/80 leading-relaxed">
        <template x-for="(p, i) in cfg.about?.paragraphs" :key="i">
          <p x-text="p"></p>
        </template>
      </div>
      <div class="mt-8 flex flex-wrap gap-2">
        <template x-for="tag in cfg.about?.tags" :key="tag">
          <span class="px-3 py-1.5 rounded-full bg-soil/5 text-xs font-medium" x-text="tag"></span>
        </template>
      </div>
    </div>
  </div>
</section>

<section class="py-12 md:py-20 bg-soft" id="work">
  <div class="max-w-5xl mx-auto px-6">
    <div class="text-center mb-12">
      <p class="text-xs uppercase tracking-[0.4em] text-terracotta mb-4">Services</p>
      <h3 class="inst text-4xl md:text-6xl">How we can work together</h3>
    </div>
    <div class="space-y-4">
      <template x-for="(svc, i) in cfg.services" :key="svc.id">
        <div class="grid md:grid-cols-[auto_1fr_auto_auto] gap-6 items-center p-6 md:p-8 rounded-3xl bg-warm hover:bg-soil hover:text-warm transition group">
          <div class="w-12 h-12 rounded-full bg-terracotta/10 text-terracotta grid place-items-center flex-shrink-0 group-hover:bg-terracotta group-hover:text-warm transition">
            <span class="inst text-xl" x-text="(i+1).toString().padStart(2, '0')"></span>
          </div>
          <div>
            <h4 class="inst text-2xl md:text-3xl" x-text="svc.name"></h4>
            <p class="mt-1 text-sm opacity-60 leading-relaxed" x-text="svc.description"></p>
          </div>
          <div class="text-left md:text-right">
            <p class="text-xs uppercase tracking-widest opacity-60" x-text="svc.duration"></p>
          </div>
          <a :href="waLink('Hi! I would like ' + svc.name)" target="_blank" class="text-sm font-medium underline underline-offset-4 opacity-60 hover:opacity-100">Book →</a>
        </div>
      </template>
    </div>
  </div>
</section>

<section class="py-12 md:py-20">
  <div class="max-w-5xl mx-auto px-6">
    <p class="text-xs uppercase tracking-[0.4em] text-terracotta mb-6">Kind words</p>
    <div class="grid md:grid-cols-3 gap-6">
      <template x-for="(t, i) in cfg.testimonials" :key="i">
        <div class="p-6 rounded-3xl bg-soft">
          <p class="inst text-lg leading-snug" x-text="'&ldquo;' + t.quote + '&rdquo;'"></p>
          <p class="mt-4 text-xs uppercase tracking-widest opacity-60" x-text="t.name"></p>
        </div>
      </template>
    </div>
  </div>
</section>

<section class="py-16 md:py-24 bg-soil text-warm" id="contact">
  <div class="max-w-3xl mx-auto px-6 text-center">
    <h3 class="inst text-4xl md:text-6xl italic mb-4">Let's chat</h3>
    <p class="text-warm/70 mb-8">Pick a time, or just message me. I reply personally.</p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a :href="waLink('Hi! I would like to work with you.')" target="_blank" class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-full bg-terracotta text-warm hover:bg-warm hover:text-soil transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.5 3.5A11 11 0 0 0 3.2 17.1L2 22l5-1.3A11 11 0 1 0 20.5 3.5Z"/></svg>
        WhatsApp
      </a>
      <a :href="'mailto:' + cfg.email" class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-full border border-warm/30 hover:bg-warm/10 transition">Email</a>
    </div>
    <div class="mt-10 text-xs uppercase tracking-widest text-warm/50">
      <span x-text="cfg.brand?.location"></span> · <span x-text="cfg.brand?.instagram"></span>
    </div>
  </div>
</section>

<footer class="bg-soil text-warm/40 py-6 text-center text-xs border-t border-warm/10">
  <p>© <span x-text="new Date().getFullYear()"></span> <span x-text="cfg.brand?.name"></span></p>
</footer>
</div>

<script>
function personalApp(){return{
  loading:true,cfg:{},
  brand:new URLSearchParams(location.search).get('brand')||'naledi',
  async init(){try{var r=await fetch('/templates/personal/data/config-'+this.brand+'.json?_='+Date.now());this.cfg=await r.json()}catch(e){console.error(e);this.cfg={brand:{name:'Personal'},services:[],testimonials:[]}}this.loading=false},
  waLink(msg){var d=String(this.cfg.whatsapp||'').replace(/\D/g,'');return 'https://wa.me/'+d+'?text='+encodeURIComponent(msg)}
}}
</script>
</body>
</html>
