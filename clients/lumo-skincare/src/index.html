<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/configs.js"></script>
<style>
:root{--f-display:"Space Grotesk",system-ui,sans-serif;--f-mono:"JetBrains Mono",monospace;--f-display:'Instrument Serif',Georgia,serif;--f-body:'Inter',system-ui,sans-serif}
body{font-family:var(--f-body)}
.disp{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:600;letter-spacing:-0.03em;line-height:1.02;}
.tight{letter-spacing:0.28em}
.p-card .p-img{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.p-card:hover .p-img{transform:scale(1.04)}
.serif-num{font-variant-numeric:oldstyle-nums}

/* lumo-grid-rules */
@media (min-width: 768px) { .p-grid { grid-template-columns: repeat(4, 1fr) !important; gap: 28px 16px !important; } }
</style>
<script data-brand-default="lumo">if(!new URLSearchParams(location.search).get("brand")){var u=new URL(location.href);u.searchParams.set("brand","lumo");history.replaceState(null,"",u);}</script>
</head>
<body class="bg-brand-surface text-brand-ink antialiased" x-data x-cloak>
<div class="bg-brand-ink text-brand-surface text-[10px] tracking-[0.25em] uppercase text-center py-2.5">Free delivery over R800 · South Africa</div>
<header class="sticky top-0 z-30 bg-brand-surface/95 backdrop-blur border-b border-black/5">
  <div class="max-w-6xl mx-auto px-5 flex items-center justify-between" style="height:56px;">
    <a href="/" class="disp text-lg md:text-xl font-semibold" x-text="$store.config.brand?.name" style="font-family:'Space Grotesk',system-ui,sans-serif;"></a>
    <nav class="flex items-center gap-6" style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;opacity:0.7;">
      <a href="#shop" class="hidden md:inline hover:opacity-100">[ Shop ]</a>
      <a href="#story" class="hidden md:inline hover:opacity-100">[ About ]</a>
      <a href="#contact" class="hidden md:inline hover:opacity-100">[ Contact ]</a>
      <button @click="$store.cart.open = true" class="flex items-center gap-1.5 hover:opacity-100">
        <svg viewBox="0 0 24 24" class="h-4 w-4 fill-none stroke-current" stroke-width="1.6"><path d="M6 7h12l-1 12H7L6 7zM9 7a3 3 0 0 1 6 0"/></svg>
        <span x-text="$store.cart && $store.cart.count ? $store.cart.count() : 0"></span>
      </button>
    </nav>
  </div>
</header>

<!-- lab intro (tight) -->
<section class="border-b border-black/5">
  <div class="max-w-6xl mx-auto px-5 py-6 md:py-9">
    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 md:gap-10">
      <div>
        <p style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;opacity:0.5;margin-bottom:8px;" x-text="$store.config.brand?.tagline"></p>
        <h1 class="disp" style="font-family:'Space Grotesk',system-ui,sans-serif;font-size:clamp(1.8rem,3vw,2.6rem);font-weight:700;letter-spacing:-0.03em;line-height:1;" x-text="$store.config.brand?.name"></h1>
        <p class="mt-3 text-xs md:text-sm opacity-60 max-w-lg" x-text="$store.config.brand?.blurb"></p>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.55;" class="flex flex-wrap gap-x-4 gap-y-1 md:text-right md:flex-col md:gap-1">
        <span>pH 5.5</span><span>Fragrance-free</span><span>Dermatologist</span><span>Vegan</span>
      </div>
    </div>
  </div>
</section>

<section id="shop" class="max-w-6xl mx-auto px-4 py-6 md:py-10">
  <div class="flex items-end justify-between mb-6">
    <div>
      <p class="tight text-[10px] uppercase opacity-50 mb-2">The collection</p>
      <h2 class="disp text-2xl md:text-3xl">Every piece, considered.</h2>
    </div>
    <p class="hidden md:block text-[11px] opacity-50 serif-num" x-text="(($store.config.visibleProducts && $store.config.visibleProducts().length) || 0) + ' pieces'"></p>
  </div>
  <ul class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-4 gap-y-8 md:gap-x-5 md:gap-y-10">
    <template x-for="p in $store.config.visibleProducts()" :key="p.id">
      <li class="p-card flex flex-col">
        <div class="relative" style="aspect-ratio:1/1;overflow:hidden;background:rgba(0,0,0,0.05);" @click="$store.config.openDetail(p)">
          <img class="p-img w-full h-full object-cover" :src="p.image || (p.images && p.images[0])" :alt="p.name" @error="if(!$event.target.dataset.f){$event.target.dataset.f='1';$event.target.src='https://placehold.co/600x600/f5f5f5/666?text='+encodeURIComponent(p.name)}">
          <span x-show="!$store.config.inStock(p)" class="absolute inset-x-0 bottom-0 bg-black/85 text-white text-[9px] tight uppercase text-center py-1">Enquire</span>
        </div>
        <div class="mt-3 flex-1 flex flex-col">
          <h3 class="disp text-base md:text-lg leading-tight truncate" x-text="p.name"></h3>
          <p class="text-[11px] opacity-55 truncate mt-0.5" x-text="p.blurb"></p>
          <div class="mt-auto pt-2.5 flex items-center justify-between gap-2">
            <p class="text-sm serif-num" x-text="$store.config.formatZAR(p.price)"></p>
            <button @click.stop="$store.cart.add(p, $store.config.pickVariant(p))" :disabled="!$store.config.inStock(p)" class="text-[10px] tight uppercase border border-current px-3 py-1.5 hover:bg-brand-ink hover:text-brand-surface transition disabled:opacity-30">Add</button>
              <button @click.stop="$store.cart.buyNow(p, $store.config.pickVariant(p))" :disabled="!$store.config.inStock(p)" class="text-[10px] tight uppercase border border-current px-2.5 py-1.5 hover:bg-brand-ink hover:text-brand-surface transition disabled:opacity-30">Buy</button>
          </div>
        </div>
      </li>
    </template>
  </ul>
</section>

<section id="story" class="bg-brand-ink text-brand-surface py-12 md:py-16">
  <div class="max-w-3xl mx-auto px-6 text-center">
    <p class="tight text-[10px] uppercase opacity-60 mb-4">The atelier</p>
    <p class="disp text-xl md:text-3xl leading-snug" x-text="$store.config.about?.paragraphs?.[0] || 'Hand-poured, one at a time. Small batches. No shortcuts.'"></p>
  </div>
</section>

<footer id="contact" class="max-w-6xl mx-auto px-4 py-10 border-t border-black/5 text-[11px] opacity-70 flex flex-wrap justify-between gap-3">
  <span class="disp text-base" x-text="$store.config.brand?.name"></span>
  <span x-text="$store.config.whatsapp ? 'WhatsApp ' + $store.config.whatsapp : ''"></span>
</footer>

<!-- detail modal -->
<div x-show="$store.config.detailOpen" x-cloak class="fixed inset-0 z-50 bg-black/70 p-0 md:p-8" @click.self="$store.config.closeDetail()">
  <div class="mx-auto h-full max-w-4xl bg-brand-surface flex flex-col md:flex-row overflow-hidden md:rounded-2xl">
    <div class="relative md:w-1/2 aspect-square md:aspect-auto md:h-full bg-black/5">
      <img :src="$store.config.detailImage()" class="w-full h-full object-cover" alt="">
      <div x-show="$store.config.detailImages().length > 1" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-2 bg-black/40 backdrop-blur rounded-full p-1.5">
        <template x-for="(url, i) in $store.config.detailImages()" :key="i">
          <button @click.stop="$store.config.detailSetImage(i)" :class="$store.config.detailImageIdx === i ? 'ring-2 ring-white' : 'opacity-60'" class="w-9 h-9 rounded-full overflow-hidden"><img :src="url" class="w-full h-full object-cover"></button>
        </template>
      </div>
      <button @click="$store.config.closeDetail()" class="absolute top-3 right-3 h-8 w-8 rounded-full bg-white/95 grid place-items-center"><svg viewBox="0 0 24 24" class="h-4 w-4 fill-none stroke-current" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="md:w-1/2 p-6 md:p-10 overflow-y-auto">
      <p class="tight text-[10px] uppercase opacity-50" x-text="$store.config.detailProduct?.category"></p>
      <h2 class="disp text-3xl md:text-4xl mt-2" x-text="$store.config.detailProduct?.name"></h2>
      <p class="mt-3 text-sm opacity-70 leading-relaxed" x-text="$store.config.detailProduct?.blurb"></p>
      <p class="mt-6 text-2xl serif-num" x-text="$store.config.formatZAR($store.config.detailTotal())"></p>
      <template x-if="$store.config.detailProduct?.specs && $store.config.detailProduct.specs.length">
        <ul class="mt-8 space-y-2.5 text-sm">
          <template x-for="s in $store.config.detailProduct.specs" :key="s">
            <li class="flex gap-3"><span class="mt-2 h-1 w-1 rounded-full bg-current opacity-40"></span><span x-text="s"></span></li>
          </template>
        </ul>
      </template>
      <button @click="$store.config.detailAddToCart()" :disabled="!$store.config.detailInStock()" class="mt-8 w-full bg-brand-primary text-white py-3.5 text-[11px] tight uppercase disabled:opacity-40">Add to cart</button>
      <button @click="$store.config.detailBuyNow()" :disabled="!$store.config.detailInStock()" class="mt-2 w-full border border-current py-3.5 text-[11px] tight uppercase disabled:opacity-40">Buy now</button>
    </div>
  </div>
</div>

<!-- cart -->
<div x-show="$store.cart.open" x-cloak @click="$store.cart.open = false" class="fixed inset-0 z-40 bg-black/50"></div>
<aside x-show="$store.cart.open" x-cloak class="fixed top-0 right-0 z-50 h-full w-full max-w-md bg-brand-surface flex flex-col">
  <div class="px-5 py-4 border-b border-black/5 flex items-center justify-between">
    <p class="tight text-[11px] uppercase">Your cart</p>
    <button @click="$store.cart.open = false" class="text-xs opacity-60">Close</button>
  </div>
  <div class="flex-1 overflow-y-auto p-5 space-y-5">
    <template x-for="i in ($store.cart?.items || [])" :key="i.id + ':' + (i.variantId || 'd')">
      <div class="flex gap-3">
        <div class="w-14 h-16 bg-black/5 overflow-hidden"><img :src="i.image" class="w-full h-full object-cover"></div>
        <div class="flex-1 min-w-0">
          <p class="text-sm truncate" x-text="i.name"></p>
          <p class="text-[11px] opacity-55 mt-0.5" x-show="i.variantName" x-text="i.variantName"></p>
          <div class="flex items-center gap-2 mt-1.5">
            <button @click="$store.cart.setQty(i.id, i.variantId, i.qty - 1)" class="w-6 h-6 grid place-items-center border border-black/15 hover:border-black/40 text-sm leading-none">−</button>
            <span class="text-xs min-w-[16px] text-center" x-text="i.qty"></span>
            <button @click="$store.cart.setQty(i.id, i.variantId, i.qty + 1)" :disabled="i.stock !== Infinity && i.qty >= i.stock" class="w-6 h-6 grid place-items-center border border-black/15 hover:border-black/40 text-sm leading-none disabled:opacity-30">+</button>
          </div>
          <p class="text-xs mt-1.5 serif-num" x-text="$store.config.formatZAR(i.price * i.qty)"></p>
        </div>
        <button @click="$store.cart.remove(i.id, i.variantId)" class="text-[11px] opacity-50 self-start">Remove</button>
      </div>
    </template>
    <p x-show="!$store.cart?.items?.length" class="text-sm opacity-50 text-center py-10">Your cart is empty.</p>
  </div>
  <div class="p-5 border-t border-black/5" x-show="$store.cart?.items?.length">
    <div class="flex justify-between mb-4 text-sm"><span class="opacity-60">Subtotal</span><span class="serif-num" x-text="$store.config.formatZAR(($store.cart && $store.cart.subtotal ? $store.cart.subtotal() : 0))"></span></div>
    <a :href="'./checkout.html?brand=' + ($store.config.id || window.__BRAND__ || 'active')" class="block text-center bg-brand-primary text-white py-3.5 text-[11px] tight uppercase">Proceed to checkout</a>
  </div>
</aside>

<script>window.__BRAND__="lumo";</script>
<script src="main.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</body>
</html>
