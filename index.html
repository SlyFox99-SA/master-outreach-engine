<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Store</title>
<link rel="stylesheet" href="/style.css" />
<script src="/configs.js"></script>
<script src="/main.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body x-data class="min-h-screen bg-brand-surface text-brand-ink antialiased font-body">
<header class="sticky top-0 z-40 bg-brand-surface border-b border-black/5 shadow-sm">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 md:py-4 flex items-center justify-between gap-4">
<div class="min-w-0">
<p class="text-[10px] uppercase tracking-[0.22em] opacity-60 truncate" x-text="$store.config.brand?.tagline"></p>
<h1 class="font-display text-lg md:text-2xl font-semibold leading-tight truncate" x-text="$store.config.brand?.name"></h1>
</div>
<div class="flex items-center gap-0.5 rounded-full bg-black/5 p-1"><button @click="$store.view.set('grid')" :class="$store.view.mode === 'grid' ? 'bg-white shadow-sm' : ''" class="grid h-8 w-8 place-items-center rounded-full transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-accent" aria-label="Grid view" title="Grid view"><svg viewBox="0 0 24 24" class="h-4 w-4 fill-current opacity-70"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button><button @click="$store.view.set('list')" :class="$store.view.mode === 'list' ? 'bg-white shadow-sm' : ''" class="grid h-8 w-8 place-items-center rounded-full transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-accent" aria-label="List view" title="List view"><svg viewBox="0 0 24 24" class="h-4 w-4 fill-current opacity-70"><path d="M3 5h18v3H3zM3 10.5h18v3H3zM3 16h18v3H3z"/></svg></button></div><button @click="$store.cart.open = true" class="relative grid h-10 w-10 place-items-center rounded-full bg-brand-primary text-brand-surface hover:opacity-90 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-accent focus-visible:ring-offset-2" aria-label="Cart"><svg viewBox="0 0 24 24" class="h-5 w-5 fill-none stroke-current" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span x-show="$store.cart.count() > 0" x-text="$store.cart.count()" class="absolute -top-1 -right-1 min-w-[20px] h-5 px-1 grid place-items-center rounded-full bg-brand-accent text-white text-[10px] font-bold"></span></button>
</div></header>
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-4 md:pt-12 md:pb-8"><h2 class="font-display text-3xl sm:text-4xl md:text-4xl lg:text-5xl font-semibold leading-[1.05] max-w-3xl" x-text="$store.config.brand?.hero?.title"></h2>
<p class="mt-3 md:mt-5 text-base md:text-xl opacity-70 max-w-2xl" x-text="$store.config.brand?.hero?.subtitle"></p></section>
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20"><template x-if="$store.config.layout !== 'gallery' && $store.config.layout !== 'showcase' && $store.view.mode === 'grid'"><ul class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-6">
<template x-for="p in $store.config.products" :key="p.id"><li class="group flex flex-col overflow-hidden rounded-2xl bg-white ring-1 ring-black/5 hover:shadow-xl transition-shadow">
<div class="aspect-square overflow-hidden bg-black/5"><img :src="p.image" :alt="p.name" class="h-full w-full object-cover group-hover:scale-105 transition duration-500" /></div>
<div class="flex flex-1 flex-col p-3 md:p-5"><h3 class="font-display text-sm md:text-base font-semibold leading-tight" x-text="p.name"></h3>
<p class="mt-1 text-xs opacity-60" x-text="p.blurb"></p>
<p class="mt-3 text-base md:text-lg font-semibold text-brand-primary" x-text="$store.config.formatZAR(p.price)"></p>
<div class="mt-3 flex flex-col sm:flex-row gap-2"><button @click="$store.cart.add(p)" class="inline-flex items-center justify-center rounded-lg bg-brand-accent px-3 py-2 text-xs font-semibold text-white hover:opacity-90 transition flex-1">Add to Cart</button>
<a :href="$store.config.payLink(p)" target="_blank" class="inline-flex items-center justify-center rounded-lg border border-black/15 px-3 py-2 text-xs font-semibold hover:bg-black/5 transition flex-1">Buy Now</a></div></div></li></template></ul></template>
<template x-if="$store.config.layout === 'gallery'"><div class="space-y-12 md:space-y-24">
<template x-for="(p, i) in $store.config.products" :key="p.id"><article class="grid md:grid-cols-2 gap-6 md:gap-16 items-center">
<div class="aspect-square overflow-hidden rounded-3xl bg-black/5"><img :src="p.image" :alt="p.name" class="h-full w-full object-cover" /></div>
<div><p class="text-xs uppercase tracking-[0.3em] opacity-50" x-text="'0' + (i + 1)"></p>
<h3 class="mt-3 font-display text-3xl md:text-5xl font-semibold leading-tight" x-text="p.name"></h3>
<p class="mt-4 text-base md:text-lg opacity-70" x-text="p.blurb"></p>
<p class="mt-8 font-display text-2xl md:text-3xl font-semibold text-brand-primary" x-text="$store.config.formatZAR(p.price)"></p>
<div class="mt-8 flex flex-wrap gap-3"><button @click="$store.cart.add(p)" class="inline-flex items-center justify-center rounded-full bg-brand-primary px-6 md:px-8 py-3 md:py-4 text-sm md:text-base font-semibold text-brand-surface hover:opacity-90 transition">Add to Cart</button>
<a :href="$store.config.payLink(p)" target="_blank" class="inline-flex items-center gap-2 rounded-full border border-black/15 px-6 md:px-8 py-3 md:py-4 text-sm md:text-base font-semibold hover:bg-black/5 transition">Buy Now</a></div></div></article></template></div></template>
<template x-if="$store.config.layout === 'showcase'"><div>
<template x-if="$store.config.products[0]"><article class="grid md:grid-cols-2 gap-6 md:gap-12 items-center rounded-3xl overflow-hidden bg-white ring-1 ring-black/5 p-5 md:p-12 mb-12">
<div class="aspect-square overflow-hidden rounded-2xl bg-black/5"><img :src="$store.config.products[0].image" :alt="$store.config.products[0].name" class="h-full w-full object-cover" /></div>
<div><p class="text-xs uppercase tracking-widest text-brand-accent font-semibold">Featured</p>
<h3 class="mt-3 font-display text-3xl md:text-5xl font-semibold leading-tight" x-text="$store.config.products[0].name"></h3>
<p class="mt-3 text-base md:text-lg opacity-70" x-text="$store.config.products[0].blurb"></p>
<p class="mt-6 font-display text-3xl md:text-4xl font-semibold text-brand-primary" x-text="$store.config.formatZAR($store.config.products[0].price)"></p>
<div class="mt-6 flex flex-wrap gap-3"><button @click="$store.cart.add($store.config.products[0])" class="inline-flex items-center justify-center rounded-full bg-brand-primary px-6 md:px-8 py-3 md:py-4 text-sm md:text-base font-semibold text-brand-surface hover:opacity-90 transition">Add to Cart</button>
<a :href="$store.config.payLink($store.config.products[0])" target="_blank" class="inline-flex items-center justify-center rounded-full border border-black/15 px-6 md:px-8 py-3 md:py-4 text-sm md:text-base font-semibold hover:bg-black/5 transition">Buy Now</a></div></div></article></template>
<h3 class="font-display text-xl md:text-2xl font-semibold mb-4 md:mb-6">More from <span x-text="$store.config.brand?.name"></span></h3>
<ul class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-6"><template x-for="p in $store.config.products.slice(1)" :key="p.id"><li class="group flex flex-col overflow-hidden rounded-2xl bg-white ring-1 ring-black/5"><div class="aspect-square overflow-hidden bg-black/5"><img :src="p.image" :alt="p.name" class="h-full w-full object-cover group-hover:scale-105 transition duration-500" /></div>
<div class="p-3 md:p-4 flex flex-col flex-1"><h4 class="text-sm md:text-base font-semibold leading-tight" x-text="p.name"></h4><p class="mt-1 text-xs opacity-60" x-text="p.blurb"></p><p class="mt-2 text-base font-semibold text-brand-primary" x-text="$store.config.formatZAR(p.price)"></p>
<div class="mt-3 flex flex-col sm:flex-row gap-2"><button @click="$store.cart.add(p)" class="inline-flex items-center justify-center rounded-lg bg-brand-accent px-3 py-2 text-xs font-semibold text-white hover:opacity-90 transition flex-1">Add to Cart</button>
<a :href="$store.config.payLink(p)" target="_blank" class="inline-flex items-center justify-center rounded-lg border border-black/15 px-3 py-2 text-xs font-semibold hover:bg-black/5 transition flex-1">Buy Now</a></div></div></li></template></ul></div></template>
<template x-if="$store.config.layout !== 'gallery' && $store.config.layout !== 'showcase' && $store.view.mode === 'list'"><ul class="divide-y divide-black/5 rounded-2xl overflow-hidden bg-white ring-1 ring-black/5">
<template x-for="p in $store.config.products" :key="p.id"><li class="grid grid-cols-[72px_1fr] md:grid-cols-[120px_1fr_auto] gap-4 p-4 md:p-6 items-center hover:bg-black/[0.02] transition">
<div class="aspect-square overflow-hidden rounded-xl bg-black/5"><img :src="p.image" :alt="p.name" class="h-full w-full object-cover" /></div>
<div class="min-w-0"><h3 class="font-display text-base md:text-xl font-semibold truncate" x-text="p.name"></h3><p class="text-xs md:text-sm opacity-60 truncate" x-text="p.blurb"></p><p class="mt-1 text-base md:text-lg font-semibold text-brand-primary" x-text="$store.config.formatZAR(p.price)"></p></div>
<div class="col-span-2 md:col-span-1 flex flex-row md:flex-col gap-2"><button @click="$store.cart.add(p)" class="flex-1 md:flex-none inline-flex items-center justify-center rounded-lg bg-brand-accent px-4 py-2 text-xs font-semibold text-white hover:opacity-90 transition">Add to Cart</button>
<a :href="$store.config.payLink(p)" target="_blank" class="flex-1 md:flex-none inline-flex items-center justify-center rounded-lg border border-black/15 px-4 py-2 text-xs font-semibold hover:bg-black/5 transition">Buy Now</a></div></li></template></ul></template>
<p x-show="!$store.config.products || $store.config.products.length === 0" class="py-20 text-center text-sm opacity-50">No products yet.</p>
</main><div x-show="$store.cart.open" @click="$store.cart.open = false" class="fixed inset-0 z-40 bg-black/40" style="display:none"></div>
<aside x-show="$store.cart.open" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full" class="fixed top-0 right-0 z-50 h-full w-full max-w-md bg-white shadow-2xl flex flex-col" style="display:none">
<div class="flex items-center justify-between px-6 py-5 border-b border-black/5"><h2 class="font-display text-xl font-semibold">Your Cart</h2>
<button @click="$store.cart.open = false" class="grid h-9 w-9 place-items-center rounded-full bg-black/5 hover:bg-black/10 transition" aria-label="Close"><svg viewBox="0 0 24 24" class="h-4 w-4 fill-none stroke-current" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
<div class="flex-1 overflow-y-auto px-6 py-4"><template x-if="$store.cart.items.length === 0"><div class="py-20 text-center text-sm opacity-50">Your cart is empty.</div></template>
<template x-for="item in $store.cart.items" :key="item.id"><div class="flex gap-4 py-4 border-b border-black/5">
<div class="w-16 h-16 rounded-lg overflow-hidden bg-black/5 flex-shrink-0"><img :src="item.image" :alt="item.name" class="w-full h-full object-cover" /></div>
<div class="flex-1 min-w-0"><h3 class="font-semibold text-sm truncate" x-text="item.name"></h3><p class="text-xs opacity-60 mt-0.5" x-text="$store.config.formatZAR(item.price)"></p>
<div class="flex items-center gap-2 mt-2"><button @click="$store.cart.setQty(item.id, item.qty - 1)" class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/10 text-sm font-bold">-</button>
<span class="text-sm font-semibold w-6 text-center" x-text="item.qty"></span>
<button @click="$store.cart.setQty(item.id, item.qty + 1)" class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/10 text-sm font-bold">+</button>
<button @click="$store.cart.remove(item.id)" class="ml-auto text-xs text-red-600 hover:underline">Remove</button></div></div></div></template></div>
<div x-show="$store.cart.items.length > 0" class="border-t border-black/5 px-6 py-5 space-y-4" style="display:none">
<div class="space-y-2"><p class="text-xs uppercase tracking-widest opacity-60">Shipping</p>
<template x-for="opt in $store.config.shippingOptions()" :key="opt.id"><label class="flex items-center gap-3 p-3 rounded-lg border border-black/10 cursor-pointer hover:bg-black/5"><input type="radio" name="shipping" :value="opt.id" x-model="$store.cart.shippingId" @change="$store.cart.persist()" /><span class="flex-1 text-sm" x-text="opt.name"></span><span class="text-sm font-semibold" x-text="$store.config.formatZAR(opt.price)"></span></label></template></div>
<textarea x-model="$store.cart.customerNote" @change="$store.cart.persist()" rows="2" placeholder="Delivery address or special instructions..." class="w-full rounded-lg border border-black/10 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-accent"></textarea>
<div class="flex items-center justify-between pt-2"><span class="text-sm opacity-60">Subtotal</span><span class="text-sm" x-text="$store.config.formatZAR($store.cart.subtotal())"></span></div>
<div class="flex items-center justify-between"><span class="text-sm opacity-60">Shipping</span><span class="text-sm" x-text="$store.config.formatZAR($store.cart.selectedShipping().price)"></span></div>
<div class="flex items-center justify-between pt-2 border-t border-black/5"><span class="font-semibold">Total</span><span class="font-display text-2xl font-semibold" x-text="$store.config.formatZAR($store.cart.grandTotal())"></span></div>
<a x-show="$store.config.hasPayment()" :href="$store.cart.payCheckout()" target="_blank" class="block w-full text-center rounded-2xl bg-brand-accent text-white px-6 py-4 font-semibold hover:opacity-90 transition" style="display:none">Pay Online Now</a>
<a :href="$store.cart.waCheckout()" target="_blank" class="block w-full text-center rounded-2xl bg-brand-primary text-brand-surface px-6 py-4 font-semibold hover:opacity-90 transition">Send Order via WhatsApp</a>
<p class="text-xs opacity-50 text-center">After you send the order, pay via EFT and share your proof of payment in the chat.</p>
<button @click="$store.cart.clear()" class="block w-full text-center text-xs opacity-60 hover:opacity-100">Clear cart</button>
</div></aside>
<footer class="border-t border-black/5 py-8"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-xs opacity-60 text-center"><p><span x-text="$store.config.brand?.name"></span> &middot; <span x-text="$store.config.brand?.tagline"></span></p></div></footer>
<button x-show="new URLSearchParams(location.search).get('frame') === 'story'" @click="window.downloadStory()" class="hidden md:flex fixed bottom-6 right-6 z-30 items-center gap-2 rounded-full bg-brand-accent px-5 py-3 text-sm font-semibold text-white shadow-2xl" style="display:none">Download 1080x1920</button>
<script>if (window.netlifyIdentity) { window.netlifyIdentity.on("init", function(user) { if (!user) { window.netlifyIdentity.on("login", function() { document.location.href = "/admin/"; }); } }); }</script></body></html>
