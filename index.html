<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Master Outreach Engine</title>
<link rel="stylesheet" href="/style.css" />
<script type="module" src="/main.js" defer></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100 antialiased font-body" x-data="{ frameMode: new URLSearchParams(location.search).get('frame') || 'phone' }" x-init="$store.config.init()">
<div aria-hidden="true" class="pointer-events-none fixed inset-0 hidden md:block bg-[radial-gradient(ellipse_at_center,rgba(245,158,11,0.08),transparent_60%)]"></div>
<main class="relative mx-auto w-full md:py-10" :class="frameMode === 'story' ? 'md:max-w-[540px]' : 'md:max-w-[390px]'">
<div id="device-frame" class="relative flex flex-col overflow-hidden min-h-[100dvh] md:min-h-0 bg-brand-surface text-brand-ink md:ring-[10px] md:ring-neutral-900 md:shadow-frame transition-all" :class="frameMode === 'story' ? 'md:h-auto md:aspect-[9/16] md:rounded-[2rem]' : 'md:h-[844px] md:rounded-[2.75rem]'">
<div aria-hidden="true" x-show="frameMode !== 'story'" class="hidden md:block absolute top-2 left-1/2 -translate-x-1/2 z-30 h-6 w-24 rounded-full bg-neutral-900"></div>
<header class="relative z-20 flex items-center justify-between gap-3 px-5 pt-[calc(env(safe-area-inset-top)+1rem)] pb-3 md:pt-12">
<div class="min-w-0"><p class="text-[10px] uppercase tracking-[0.22em] opacity-60 truncate" x-text="$store.config.brand?.tagline"></p>
<h1 class="font-display text-xl font-semibold leading-tight truncate" x-text="$store.config.brand?.name"></h1></div>
<a :href="$store.config.waLink()" target="_blank" rel="noopener" class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-brand-primary text-brand-surface hover:opacity-90 active:scale-95 transition" aria-label="Chat on WhatsApp"><svg viewBox="0 0 24 24" class="h-5 w-5 fill-current"><path d="M20.5 3.5A11 11 0 0 0 3.2 17.1L2 22l5-1.3A11 11 0 1 0 20.5 3.5Zm-8.4 17a9 9 0 0 1-4.6-1.3l-.3-.2-3 .8.8-2.9-.2-.3A9 9 0 1 1 12.1 20.5Z"/></svg></a>
</header>
<div class="flex-1 overflow-y-auto no-scrollbar px-5 pb-6">
<section class="pt-1 pb-5"><h2 class="font-display text-2xl font-semibold leading-tight" x-text="$store.config.brand?.hero?.title ?? 'Featured this week'"></h2>
<p class="mt-1 text-sm opacity-70" x-text="$store.config.brand?.hero?.subtitle ?? ''"></p></section>
<section aria-label="Products"><ul class="grid grid-cols-2 gap-3">
<template x-for="product in $store.config.products" :key="product.id"><li>
<article class="group flex h-full flex-col overflow-hidden rounded-2xl bg-white/60 ring-1 ring-black/5 backdrop-blur">
<div class="aspect-square overflow-hidden bg-black/5"><img :src="product.image" :alt="product.name" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" /></div>
<div class="flex flex-1 flex-col p-3">
<h3 class="font-display text-sm font-semibold leading-tight line-clamp-2" x-text="product.name"></h3>
<p class="mt-0.5 text-[11px] opacity-60 line-clamp-1" x-text="product.blurb ?? ''"></p>
<p class="mt-2 text-sm font-semibold text-brand-primary" x-text="$store.config.formatZAR(product.price)"></p>
<a :href="$store.config.waLink(product)" target="_blank" rel="noopener" class="mt-2 inline-flex items-center justify-center rounded-lg bg-brand-accent px-3 py-1.5 text-[11px] font-medium text-white hover:opacity-90 active:scale-[0.98] transition">Order</a>
</div></article></li></template></ul>
<p x-show="!$store.config.products?.length" class="py-12 text-center text-sm opacity-50">Loading catalogue...</p>
</section></div>
<footer class="sticky bottom-0 z-20 px-5 pt-3 pb-[calc(env(safe-area-inset-bottom)+1rem)] bg-gradient-to-t from-brand-surface via-brand-surface to-transparent"><a :href="$store.config.waLink()" target="_blank" rel="noopener" class="flex items-center justify-center gap-2 rounded-2xl bg-brand-primary px-4 py-3.5 text-sm font-semibold text-brand-surface shadow-lg shadow-black/10 hover:opacity-95 active:scale-[0.99] transition">Chat on WhatsApp</a></footer>
</div>
<button x-show="frameMode === 'story'" @click="window.downloadStory()" class="hidden md:flex fixed bottom-6 right-6 z-50 items-center gap-2 rounded-full bg-brand-accent px-5 py-3 text-sm font-semibold text-white shadow-2xl hover:opacity-90 active:scale-95 transition">Download 1080x1920</button>
</main></body></html>
